[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wuwei-backend"
version = "0.1.0"
description = "3D home inventory locator"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "argon2-cffi==25.1.0",
    "pillow==13.0.0",
    "python-multipart==0.0.33",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "httpx==0.28.1"]

[project.scripts]
wuwei-admin = "app.admin:main"

[tool.setuptools]
packages = ["app", "app.routers", "app.services"]

[tool.setuptools.package-data]
app = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["../tests/backend"]

[tool.uv]
required-version = "==0.13.7"
# Preserve the dependency graph verified in production (Python 3.12.3) and on
# Windows (Python 3.13). Update these constraints deliberately with the lock.
constraint-dependencies = [
    "annotated-doc==0.0.5", "annotated-types==0.8.0", "anyio==4.16.0",
    "argon2-cffi-bindings==26.1.0", "certifi==2026.10.23", "cffi==2.1.1",
    "click==8.5.0", "colorama==0.4.6", "h11==0.16.0", "httpcore==1.0.9",
    "httptools==0.9.0", "idna==3.20", "iniconfig==2.3.1",
    "opentelemetry-api==1.45.2", "packaging==26.3", "pluggy==1.7.0",
    "pycparser==3.12", "pydantic==2.14.2", "pydantic-core==2.50.2",
    "pygments==2.21.0", "python-dotenv==1.2.4", "pyyaml==6.0.3",
    "starlette==1.10.0", "typing-inspection==0.4.4", "typing-extensions==4.16.0",
    "uvloop==0.23.0", "watchfiles==1.3.0", "websockets==17.4",
]
