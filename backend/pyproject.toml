[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wuwei-backend"
version = "0.1.0"
description = "3D home inventory locator"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "argon2-cffi>=23.1",
    "pillow>=10.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
wuwei-admin = "app.admin:main"

[tool.setuptools]
packages = ["app", "app.routers", "app.services"]

[tool.setuptools.package-data]
app = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["../../test/wuwei/backend"]
